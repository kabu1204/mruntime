name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find include src test bench cli -name '*.h' -o -name '*.cpp' \
            | xargs clang-format-18 -i
          git diff --exit-code || {
            echo "::error::Code is not formatted. Run clang-format and commit the changes."
            exit 1
          }

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Arm64
            runner: ubuntu-24.04-arm
          - name: macOS Arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMRUNTIME_BUILD_TESTS=ON
          -DMRUNTIME_BUILD_BENCH=ON
          -DMRUNTIME_BUILD_CLI=ON
          -DMRUNTIME_ENABLE_VULKAN=OFF

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure
